[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcleanfuel"
version = "0.1.0"
description = "麦麦减脂燃料师 - 基于麦当劳 MCP 的健康减脂餐规划 Skill"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Liyuchen0118"}
]
keywords = ["mcdonalds", "mcp", "nutrition", "cutting", "fitness", "skill", "ai-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Health :: Nutrition",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
mcleanfuel = "mcleanfuel.cli:main"
mcleanfuel-plan = "mcleanfuel.cli:plan_cmd"
mcleanfuel-report = "mcleanfuel.cli:report_cmd"

[project.urls]
Homepage = "https://github.com/Liyuchen0118/mcd-lean-fuel"
Issues = "https://github.com/Liyuchen0118/mcd-lean-fuel/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcleanfuel = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
